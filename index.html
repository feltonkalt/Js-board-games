<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <h1>Прокат настольных игр</h1>
    <input type="checkbox" id='freeGame'>
    <label for="freeGame"> показать только свободные игры</label>
    <ul id="gameList"></ul>

    <label for="gameSelect">Игра</label>
    <select id="gameSelect">
        <option value="0">Каркассон</option>
        <option value="1">Доббль</option>
        <option value="2">Шахматы</option>
    </select>

    <h1>Прокат игр</h1>
    <label for="borrowerName">Имя посетителя</label>
    <input id="borrowerName" type="text">
    <button id="borrowButton" type="button">Выдать</button>
    <button id="returnButton" type="button">Вернуть</button>
    <p id="message"></p>


    <h1>Добавить игру</h1>
    <label for="NameGame"> Введите название игры</label>
    <input type="text" id="NameGame">
    <label for="PlayersGame">Введите кол-во игроков</label>
    <input type="text" id="PlayersGame">
    <button id="addGame">Добавить игру</button>
</body>

</html>
